<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <!-- Terminal Background Gradient -->
    <linearGradient id="termBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#262144"/>
      <stop offset="100%" stop-color="#1E1938"/>
    </linearGradient>
  </defs>

  <style><![CDATA[
    @keyframes L0 { 0%, 3.6% { clip-path: inset(0 100% 0 0); } 15.0%, 94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes L1 { 0%, 22.1% { clip-path: inset(0 100% 0 0); } 33.6%, 94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes L2 { 0%, 40.7% { clip-path: inset(0 100% 0 0); } 52.1%, 94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes L3 { 0%, 59.3% { clip-path: inset(0 100% 0 0); } 70.7%, 94% { clip-path: inset(0 0 0 0); } 100% { clip-path: inset(0 100% 0 0); } }
    @keyframes bl { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

    .L0 { animation: L0 14s steps(45) infinite; }
    .L1 { animation: L1 14s steps(45) infinite; }
    .L2 { animation: L2 14s steps(45) infinite; }
    .L3 { animation: L3 14s steps(45) infinite; }
    .c { animation: bl 1s steps(1) infinite; }

    .term-title { font-family: 'Comfortaa', 'Quicksand', 'Trebuchet MS', 'Segoe UI', sans-serif; font-weight: 800; }
    .term-code { font-family: 'Fira Code', 'Courier New', Consolas, monospace; font-weight: 600; }
  ]]></style>

  <!-- Terminal Window Container -->
  <rect x="3" y="3" width="894" height="354" rx="18" fill="url(#termBg)" stroke="#FFAEDB" stroke-width="2.5"/>

  <!-- Top Window Bar -->
  <path d="M3 21a18 18 0 0 1 18-18h858a18 18 0 0 1 18 18v32H3z" fill="#FFAEDB"/>
  <circle cx="30" cy="28" r="6.5" fill="#FF70A6"/>
  <circle cx="52" cy="28" r="6.5" fill="#FFD27A"/>
  <circle cx="74" cy="28" r="6.5" fill="#A8E6A1"/>
  <text class="term-title" x="450" y="34" font-size="14" text-anchor="middle" fill="#241D38">~/meenakshi — zsh</text>

  <!-- Command Line 0: whoami -->
  <g class="L0">
    <text class="term-code" x="30" y="96" font-size="16">
      <tspan fill="#FFAEDB">meenakshi@dev</tspan><tspan fill="#F5F0E1">:</tspan><tspan fill="#A8E6A1">~</tspan><tspan fill="#F5F0E1">$ whoami</tspan>
    </text>
    <text class="term-code" x="30" y="122" font-size="15" fill="#FFD27A">→ Meenakshi — CS @ Sri Shakthi '28, AI builder</text>
  </g>

  <!-- Command Line 1: cat focus.txt -->
  <g class="L1">
    <text class="term-code" x="30" y="160" font-size="16">
      <tspan fill="#FFAEDB">meenakshi@dev</tspan><tspan fill="#F5F0E1">:</tspan><tspan fill="#A8E6A1">~</tspan><tspan fill="#F5F0E1">$ cat focus.txt</tspan>
    </text>
    <text class="term-code" x="30" y="186" font-size="15" fill="#FFD27A">→ Computer Vision · Generative AI · Scalable Full-Stack</text>
  </g>

  <!-- Command Line 2: ls projects/ -->
  <g class="L2">
    <text class="term-code" x="30" y="224" font-size="16">
      <tspan fill="#FFAEDB">meenakshi@dev</tspan><tspan fill="#F5F0E1">:</tspan><tspan fill="#A8E6A1">~</tspan><tspan fill="#F5F0E1">$ ls projects/</tspan>
    </text>
    <text class="term-code" x="30" y="250" font-size="15" fill="#FFD27A">→ grademind  bloomtale  minchal  goodboxd  ridemate  classroom-monitor</text>
  </g>

  <!-- Command Line 3: echo $MINDSET -->
  <g class="L3">
    <text class="term-code" x="30" y="288" font-size="16">
      <tspan fill="#FFAEDB">meenakshi@dev</tspan><tspan fill="#F5F0E1">:</tspan><tspan fill="#A8E6A1">~</tspan><tspan fill="#F5F0E1">$ echo $MINDSET</tspan>
    </text>
    <text class="term-code" x="30" y="314" font-size="15" fill="#FFD27A">→ Turn ambitious ideas into working code, one commit at a time</text>
  </g>

  <!-- Idle Prompt & Blinking Cursor -->
  <text class="term-code" x="30" y="350" font-size="16">
    <tspan fill="#FFAEDB">meenakshi@dev</tspan><tspan fill="#F5F0E1">:</tspan><tspan fill="#A8E6A1">~</tspan><tspan fill="#F5F0E1">$ </tspan>
  </text>
  <rect class="c" x="206" y="335" width="9.5" height="18" fill="#A8E6A1"/>
</svg>