<text x="28" y="92" font-size="16" font-weight="700" fill="#F5F0E1" style="font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif">Campus ride-sharing platform</text>
<text x="28" y="116" font-size="16" font-weight="700" fill="#F5F0E1" opacity=".85" style="font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif">with route &amp; fare comparisons</text>
