<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 210" width="480" height="210" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#46407F"/><stop offset="1" stop-color="#3A3768"/></linearGradient>
<linearGradient id="bd" x1="0" x2="1"><stop offset="0" stop-color="#F4A6DC"/><stop offset="1" stop-color="#A8E6A1"/></linearGradient></defs>
<style>
@keyframes run{to{stroke-dashoffset:-1000}}@keyframes fl{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-9px) rotate(5deg)}}@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}@keyframes sh{0%{transform:translateX(-120px)}60%,100%{transform:translateX(620px)}}
.run{animation:run 6s linear infinite}.em{animation:fl 3.6s ease-in-out infinite;animation-delay:1.6s;transform-origin:430px 52px}.tw{animation:tw 2.2s ease-in-out infinite}.sh{animation:sh 5s ease-in-out infinite;animation-delay:2.8s}
</style>
<clipPath id="c"><rect x="4" y="4" width="472" height="202" rx="20"/></clipPath>
<rect x="4" y="4" width="472" height="202" rx="20" fill="url(#gr)"/>
<g clip-path="url(#c)"><rect class="sh" x="0" y="-20" width="70" height="260" fill="#fff" opacity=".07" transform="skewX(-20)"/></g>
<rect x="4" y="4" width="472" height="202" rx="20" fill="none" stroke="#F4A6DC" stroke-opacity=".35" stroke-width="3"/>
<rect class="run" x="4" y="4" width="472" height="202" rx="20" fill="none" stroke="url(#bd)" stroke-width="4" stroke-linecap="round" stroke-dasharray="160 840" pathLength="1000"/>
<circle class="tw" cx="360" cy="30" r="3" fill="#F4A6DC"/><circle class="tw" cx="402" cy="96" r="2.5" fill="#A8E6A1" style="animation-delay:.8s"/><circle class="tw" cx="450" cy="150" r="3" fill="#F4A6DC" style="animation-delay:1.4s"/>
