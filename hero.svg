<linearGradient id="shine" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#F4A6DC"/><stop offset=".45" stop-color="#F4A6DC"/><stop offset=".5" stop-color="#fff"/><stop offset=".55" stop-color="#F4A6DC"/><stop offset="1" stop-color="#F4A6DC"/>
