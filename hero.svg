<style>
.t{font-family:'Trebuchet MS','Segoe UI',Arial,sans-serif;font-weight:800} .m{font-family:'Courier New',Consolas,monospace;font-weight:700}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes sw{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes pop{0%{transform:translateY(30px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes ln{0%,8%{clip-path:inset(0 100% 0 0)}25%,92%{clip-path:inset(0 0 0 0)}100%{clip-path:inset(0 100% 0 0)}}
.f1{animation:fl 4s ease-in-out infinite} .f2{animation:fl 5s ease-in-out infinite .8s} .f3{animation:fl 4.5s ease-in-out infinite 1.6s}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.sway{animation:sw 5s ease-in-out infinite;transform-origin:0 0}
.c{animation:bl 1s steps(1) infinite}
.pop{animation:pop .9s cubic-bezier(.2,.8,.3,1) both}
.code text{animation:ln 9s steps(22) infinite}
</style>
